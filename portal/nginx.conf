server {
    listen 80;

    # Student portal static files
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Guacamole reverse proxy — serves at the same origin as the portal so the
    # portal JS can call /guacamole/api/tokens without CORS issues and the
    # ?token= URL parameter works for seamless auto-login.
    location /guacamole/ {
        proxy_pass         http://guacamole:8080/guacamole/;
        proxy_http_version 1.1;

        # WebSocket upgrade — essential for Guacamole's tunnel
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;

        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
