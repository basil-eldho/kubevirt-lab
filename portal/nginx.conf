server {
    listen 80;

    # Nothing is hosted at the root. This nginx exists only to put Guacamole on
    # a single origin reachable from outside the cluster, so send visitors on.
    location = / {
        return 302 /guacamole/;
    }

    # Guacamole reverse proxy. Two things depend on going through here rather
    # than hitting the guacamole Service directly:
    #   * the ?token= auto-login in the link vm-connect.sh prints, which only
    #     works when the API and the client share an origin
    #   * the WebSocket upgrade headers below, which Guacamole's tunnel needs
    location /guacamole/ {
        proxy_pass         http://guacamole:8080/guacamole/;
        proxy_http_version 1.1;

        # WebSocket upgrade — essential for Guacamole's tunnel
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;

        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
