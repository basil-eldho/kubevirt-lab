# ── pool-controller: manages pool VMs and their desktop Services ──────────────
# Guacamole reaches every desktop over a ClusterIP Service, so the controller no
# longer creates Deployments and no VNC-subresource ServiceAccount is needed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pool-controller
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pool-controller
rules:
- apiGroups: [kubevirt.io]
  resources: [virtualmachines, virtualmachineinstances]
  verbs: [get, list, watch, create, delete, patch, update]
- apiGroups: [""]
  resources: [services]
  verbs: [get, list, watch, create, delete, patch, update]
# Read-only: the API resolves the node InternalIP once at startup to build the
# browser-facing Guacamole URL.
- apiGroups: [""]
  resources: [nodes]
  verbs: [get, list]
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [""]
  resources: [events]
  verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pool-controller
subjects:
- kind: ServiceAccount
  name: pool-controller
  namespace: default
roleRef:
  kind: ClusterRole
  name: pool-controller
  apiGroup: rbac.authorization.k8s.io
