apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-portal
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-portal
  template:
    metadata:
      labels:
        app: student-portal
    spec:
      containers:
      - name: portal
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: nginx.conf
      volumes:
      - name: html
        configMap:
          name: portal-html
      - name: nginx-conf
        configMap:
          name: portal-nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: student-portal
  namespace: default
spec:
  type: NodePort
  selector:
    app: student-portal
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30000
