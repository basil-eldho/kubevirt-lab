# nginx reverse proxy that publishes Guacamole on NodePort 30000.
#
# Guacamole itself has no NodePort (see deploy/guacamole.yaml): the desktop link
# carries a ?token= parameter, and that auto-login only works when the Guacamole
# API and client are on the same origin. This proxy is that origin, and it also
# adds the WebSocket upgrade headers the Guacamole tunnel requires.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-portal
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-portal
  template:
    metadata:
      labels:
        app: student-portal
    spec:
      containers:
      - name: portal
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: nginx.conf
      volumes:
      - name: nginx-conf
        configMap:
          name: portal-nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: student-portal
  namespace: default
spec:
  type: NodePort
  selector:
    app: student-portal
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30000
