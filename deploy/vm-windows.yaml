# A Windows desktop VM backed by the golden image built by `make golden-windows`.
# `make vm OS=windows NAME=win1` substitutes __NAME__ and __GOLDEN__ and applies the
# result, so this file is a template and not directly applyable.
#
# rootdisk is an `ephemeral` volume: KubeVirt mounts the golden PVC read-only and
# gives this VM its own copy-on-write overlay on node-local storage. Nothing is
# copied, so the VM starts as fast as it can boot. The overlay is discarded when
# the VMI goes away, so a stop/start returns a pristine desktop — a guest reboot
# keeps it, `virtctl stop` does not.
#
# Because every start re-runs OOBE against the pristine image, the sysprep answer
# file below is now required on every boot, not just the first.
#
# Two parts of this are load-bearing and easy to drop when adapting it:
#
#   * The sysprep volume. The golden image was sysprepped with /oobe, so without an
#     answer file the VM boots into the OOBE setup wizard instead of the desktop.
#     `make vm` applies deploy/windows-pool-unattend.yaml for you.
#   * The hyperv enlightenments below. Windows runs acceptably slowly without them.
#
# app=lab-vm is what `make status`, `make clean` and the desktop Service selector
# match on. Keep it if you copy this file.
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: __NAME__
  namespace: default
  labels:
    app: lab-vm
    lab-vm-os: windows
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        kubevirt.io/vm: __NAME__
        app: lab-vm
    spec:
      domain:
        cpu:
          cores: 2
          model: host-passthrough
        resources:
          requests:
            memory: 4Gi
        features:
          smm:
            enabled: true
          hyperv:
            relaxed:
              enabled: true
            vapic:
              enabled: true
            spinlocks:
              enabled: true
              spinlocks: 8191
        firmware:
          bootloader:
            efi:
              secureBoot: false
        devices:
          disks:
          - name: rootdisk
            disk:
              bus: virtio
          - name: sysprep
            cdrom:
              bus: sata
          interfaces:
          - name: default
            masquerade: {}
      networks:
      - name: default
        pod: {}
      volumes:
      - name: rootdisk
        ephemeral:
          persistentVolumeClaim:
            claimName: __GOLDEN__
      - name: sysprep
        sysprep:
          configMap:
            name: windows-pool-unattend
