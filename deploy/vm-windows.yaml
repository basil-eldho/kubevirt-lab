# A Windows desktop VM, cloned from the golden image built by `make golden-windows`.
# `make vm OS=windows NAME=win1` substitutes __NAME__ and __DATASOURCE__ and applies
# the result, so this file is a template and not directly applyable.
#
# Two parts of this are load-bearing and easy to drop when adapting it:
#
#   * The sysprep volume. The golden image was sysprepped with /oobe, so without an
#     answer file the clone boots into the OOBE setup wizard instead of the desktop.
#     `make vm` applies deploy/windows-pool-unattend.yaml for you.
#   * The hyperv enlightenments below. Windows runs acceptably slowly without them.
#
# app=lab-vm is what `make status`, `make clean` and the desktop Service selector
# match on. Keep it if you copy this file.
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: __NAME__
  namespace: default
  labels:
    app: lab-vm
    lab-vm-os: windows
spec:
  runStrategy: Always
  dataVolumeTemplates:
  - metadata:
      name: __NAME__-disk
    spec:
      sourceRef:
        kind: DataSource
        name: __DATASOURCE__
        namespace: default
      storage:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 64Gi
        storageClassName: standard
  template:
    metadata:
      labels:
        kubevirt.io/vm: __NAME__
        app: lab-vm
    spec:
      domain:
        cpu:
          cores: 2
          model: host-passthrough
        resources:
          requests:
            memory: 4Gi
        features:
          smm:
            enabled: true
          hyperv:
            relaxed:
              enabled: true
            vapic:
              enabled: true
            spinlocks:
              enabled: true
              spinlocks: 8191
        firmware:
          bootloader:
            efi:
              secureBoot: false
        devices:
          disks:
          - name: rootdisk
            disk:
              bus: virtio
          - name: sysprep
            cdrom:
              bus: sata
          interfaces:
          - name: default
            masquerade: {}
      networks:
      - name: default
        pod: {}
      volumes:
      - name: rootdisk
        dataVolume:
          name: __NAME__-disk
      - name: sysprep
        sysprep:
          configMap:
            name: windows-pool-unattend
