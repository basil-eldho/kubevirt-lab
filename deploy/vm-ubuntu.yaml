# An Ubuntu desktop VM backed by the golden image built by `make golden-ubuntu`.
# `make vm OS=ubuntu NAME=lab1` substitutes __NAME__ and __GOLDEN__ and applies the
# result, so this file is a template and not directly applyable.
#
# rootdisk is an `ephemeral` volume: KubeVirt mounts the golden PVC read-only and
# gives this VM its own copy-on-write overlay on node-local storage. Nothing is
# copied, so the VM starts as fast as it can boot. The overlay is discarded when
# the VMI goes away, so a stop/start returns a pristine desktop — a guest reboot
# keeps it, `virtctl stop` does not.
#
# Everything the desktop needs — XFCE, autologin, x11vnc on :5900 — is already
# inside that image; see golden/ubuntu/scripts/setup-desktop.sh.
#
# app=lab-vm is what `make status`, `make clean` and the desktop Service selector
# match on. Keep it if you copy this file.
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: __NAME__
  namespace: default
  labels:
    app: lab-vm
    lab-vm-os: ubuntu
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        kubevirt.io/vm: __NAME__
        app: lab-vm
    spec:
      domain:
        cpu:
          cores: 2
          model: host-passthrough
        resources:
          requests:
            memory: 2Gi
        features:
          smm:
            enabled: true
        firmware:
          bootloader:
            efi:
              secureBoot: false
        devices:
          disks:
          - name: rootdisk
            disk:
              bus: virtio
          - name: cloudinitdisk
            disk:
              bus: virtio
          interfaces:
          - name: default
            masquerade: {}
      networks:
      - name: default
        pod: {}
      volumes:
      - name: rootdisk
        ephemeral:
          persistentVolumeClaim:
            claimName: __GOLDEN__
      - name: cloudinitdisk
        cloudInitNoCloud:
          userData: |
            #cloud-config
            hostname: __NAME__
