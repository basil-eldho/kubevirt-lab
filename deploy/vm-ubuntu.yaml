# An Ubuntu desktop VM, cloned from the golden image built by `make golden-ubuntu`.
# `make vm OS=ubuntu NAME=lab1` substitutes __NAME__ and __DATASOURCE__ and applies
# the result, so this file is a template and not directly applyable.
#
# The disk is a copy-on-write clone of the golden PVC, which is why a VM starts in
# a couple of minutes instead of running an OS installer. Everything the desktop
# needs — XFCE, autologin, x11vnc on :5900 — is already inside that image; see
# golden/ubuntu/scripts/setup-desktop.sh.
#
# app=lab-vm is what `make status`, `make clean` and the desktop Service selector
# match on. Keep it if you copy this file.
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: __NAME__
  namespace: default
  labels:
    app: lab-vm
    lab-vm-os: ubuntu
spec:
  runStrategy: Always
  dataVolumeTemplates:
  - metadata:
      name: __NAME__-disk
    spec:
      sourceRef:
        kind: DataSource
        name: __DATASOURCE__
        namespace: default
      storage:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 20Gi
        storageClassName: standard
  template:
    metadata:
      labels:
        kubevirt.io/vm: __NAME__
        app: lab-vm
    spec:
      domain:
        cpu:
          cores: 2
          model: host-passthrough
        resources:
          requests:
            memory: 2Gi
        features:
          smm:
            enabled: true
        firmware:
          bootloader:
            efi:
              secureBoot: false
        devices:
          disks:
          - name: rootdisk
            disk:
              bus: virtio
          - name: cloudinitdisk
            disk:
              bus: virtio
          interfaces:
          - name: default
            masquerade: {}
      networks:
      - name: default
        pod: {}
      volumes:
      - name: rootdisk
        dataVolume:
          name: __NAME__-disk
      - name: cloudinitdisk
        cloudInitNoCloud:
          userData: |
            #cloud-config
            hostname: __NAME__
