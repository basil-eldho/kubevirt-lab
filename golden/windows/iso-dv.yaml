# Windows ISO DataVolume — uploaded from the host via virtctl.
# `make golden-windows` fetches (or reuses) the installer ISO, injects
# Autounattend.xml, then image-uploads the repacked file here. Source is
# `upload` rather than `http` because the media has to be mutated on the host
# first; CDI cannot pull a public Microsoft URL the way it does Ubuntu.
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: windows-iso
  annotations:
    cdi.kubevirt.io/storage.bind.immediate.requested: "true"
spec:
  storage:
    accessModes: [ReadWriteOnce]
    resources:
      requests:
        storage: 8Gi
    storageClassName: standard
  source:
    upload: {}
