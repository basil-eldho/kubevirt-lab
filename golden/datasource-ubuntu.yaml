# CDI DataSource — the stable name that VMs clone their disk from.
# Packer creates this automatically after a successful build.
# Apply manually only if you need to recreate it (e.g. after cluster reset).
#
# To upgrade the golden image later:
#   1. Run: make golden-ubuntu  (Packer builds a new DataVolume)
#   2. Patch this DataSource to point at the new PVC — VMs created afterwards
#      pick up the new image; existing VMs keep the disk they already cloned.
#
# When Ceph is available, change spec.source from pvc → snapshot for instant
# CoW clones. Nothing else needs to change.
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataSource
metadata:
  name: ubuntu-golden
  namespace: default
spec:
  source:
    pvc:
      name: ubuntu-golden      # DataVolume PVC created by Packer
      namespace: default
